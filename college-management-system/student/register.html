<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration · College Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <style>
    .auth-hero { background: linear-gradient(160deg, #064e3b, #047857); }
    .auth-hero::after { background: radial-gradient(600px 300px at 85% -10%, rgba(255,255,255,0.07), transparent 60%); }
    .role-pill { background: var(--success-100) !important; color: var(--success-600) !important; }
    .btn-primary { background: var(--success-600); }
    .btn-primary:hover { background: #166534; }
    .auth-hero .hero-points svg, .auth-hero .logo-badge svg { color: #6ee7b7 !important; }
  </style>
</head>
<body class="auth-student">
  <div class="auth-wrap">
    <section class="auth-hero hero-student">
      <div class="brand-row">
        <div class="logo-badge" id="logoBadge"></div>
        <div>
          <div class="brand-name" id="collegeName">College</div>
          <div class="brand-sub">Student Portal</div>
        </div>
      </div>
      <div class="hero-content">
        <h1>Create your student account.</h1>
        <p>Register to access your classes, announcements and study material.</p>
        <ul class="hero-points" id="heroPoints"></ul>
      </div>
      <div class="hero-foot" id="heroFoot"></div>
    </section>

    <section class="auth-form-panel">
      <div class="auth-card">
        <span class="role-pill" id="rolePill"></span>
        <h2>Create account</h2>
        <p class="auth-desc">It only takes a moment to get started.</p>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Full name <span class="req">*</span></label>
            <input class="input" id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Rahul Deshmukh" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email <span class="req">*</span></label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password <span class="req">*</span></label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
              <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password"></button>
            </div>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm password <span class="req">*</span></label>
            <div class="input-group">
              <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" />
              <button type="button" class="toggle-visibility" id="toggleConfirm" aria-label="Show password"></button>
            </div>
            <div class="field-error"></div>
          </div>

          <!-- Role-specific profile fields are injected here by registerPage.js -->
          <div id="profileFields"></div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
        </form>

        <div class="auth-divider">or</div>
        <button type="button" class="btn-google" id="googleBtn"></button>

        <p class="auth-footer-link">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </section>
  </div>

  <script type="module">
    import { APP, ROLES, ROUTES } from '../js/config.js';
    import { icon, googleIcon } from '../js/common/icons.js';
    import { initRegisterPage } from '../js/common/registerPage.js';

    document.getElementById('logoBadge').innerHTML = `<img src="../${APP.COLLEGE_LOGO.replace(/^\//, '')}" alt="${APP.COLLEGE_NAME} logo" />`;
    document.getElementById('collegeName').innerHTML = `<span class="brand-ask">Ask</span><span class="brand-book">book</span>`;
    document.getElementById('rolePill').innerHTML = icon('graduation') + ' Student';
    document.getElementById('heroFoot').textContent = `${APP.COLLEGE_NAME} · ${APP.NAME}`;
    document.getElementById('googleBtn').innerHTML = googleIcon() + ' Continue with Google';
    document.getElementById('heroPoints').innerHTML = [
      'Classes tailored to your branch',
      'Targeted announcements',
      'Previous question papers',
    ].map((t) => `<li>${icon('check')}<span>${t}</span></li>`).join('');

    initRegisterPage({ role: ROLES.STUDENT, dashboardUrl: ROUTES.STUDENT.DASHBOARD });
  </script>
</body>
</html>
